name: Retired model-generation nightly (no-op)

# RC-16: the live Code UI generation matrix was removed with `libra code`.
# Keep the workflow file so scheduled/manual dispatch stays valid; the job is a
# no-op until RC-30 deletes the file.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  retired-model-generation:
    name: retired_model_generation_noop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No-op after public Code CLI removal
        run: echo "Live Code UI generation matrix was retired; this nightly is a no-op."

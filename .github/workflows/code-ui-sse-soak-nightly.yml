name: Retired Code UI SSE soak (no-op)

# RC-16: the public Code UI and its soak target were removed with `libra code`.
# Keep the workflow file so scheduled/manual dispatch stays valid; the job is a
# no-op until RC-30 deletes the file.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  retired-code-ui-soak:
    name: retired_code_ui_soak_noop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No-op after public Code CLI removal
        run: echo "Public Code UI soak was retired; this nightly is a no-op."
